name: CI
on: { push: { branches: [main, fixed] }, pull_request: {} }
jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q
